---
# Busted/plenary test globals for selene.
# Combine with the vim std via `std = "vim+busted"`.
base: lua51

globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  before_each:
    args:
      - type: function
  after_each:
    args:
      - type: function
  pending:
    args:
      - type: string
      - type: function
  assert:
    any: true
